name: Silo
options:
  bundleIdPrefix: com.ilia.silo
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  Silo:
    type: application
    platform: iOS
    sources:
      - path: Silo
    dependencies:
      - framework: ../vendor/idevice/swift/IDevice.xcframework
        embed: false
    scheme:
      testTargets: []
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilia.silo
        INFOPLIST_KEY_CFBundleDisplayName: SideBack
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: "../vendor/idevice/swift/include/idevice.h"
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
